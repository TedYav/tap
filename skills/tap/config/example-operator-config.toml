[presets.opus46]
description = "Claude Opus 4.6, with medium effort"
harness = "claude"
params.model = "claude-opus-4-6[1m]"
params.effort = "medium"
env.CLAUDE_CODE_AUTO_COMPACT_WINDOW = "420000"
env.CLAUDE_AUTOCOMPACT_PCT_OVERRIDE = "95"
metadata.pronouns = "he/him"
metadata.intelligence = "advanced"
metadata.cost_basis = "subscription"
metadata.cost_level = "medium low"
metadata.budget_capacity = "very high"
metadata.speed = "medium fast"
metadata.summary = "Older Claude Opus Model, many people swear by it for faithful implementation without overengineering. Use as implementer or partner, not for complex design or architecture."
metadata.primary_roles = [ "driver", "implementer", "partner" ]
metadata.secondary_roles = [ "reviewer", "prose_writer" ]
