# Session-creating commands start an absent tmux server from HOME.
[tmux]
bootstrap = true

# File-only lifecycle details; adds command-capture and disk I/O overhead.
# Set to "verbose" for developer diagnostics. Never enables tmux tracing.
[diagnostics]
level = "off"

# Human notifications: macOS osascript or Linux notify-send by default.
# macOS needs terminal notification permission; Linux needs a desktop service.
[notifications]
notifier = "system"
timeout_seconds = 20
# To use an external transport, set command first, then notifier = "command".
# command = ["my-notifier", "--title", "{title}", "--urgency", "{urgency}", "--", "{body}"]
# Tokens are literal argv; urgency is routine|urgent. No shell or fallback.
