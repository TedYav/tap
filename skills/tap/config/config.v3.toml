# TAP global config — presets, harness policy, fun.
# THIS FILE IS THE CHECKED-IN REFERENCE (tap-2z5r): the catalog `tap setup --machine`
# installs starters and named presets from. Do not copy it over a machine config;
# setup adds the selected entries and preserves everything else. For a fuller,
# real-world config to read for ideas, see example-operator-config.toml beside it.
# Location contract for the live copy: ${XDG_CONFIG_HOME:-~/.config}/tap/config.toml
# Presets supply HARNESS TUNING only — never identity, team, cwd, bus,
# or TAP_* (design consult, 2026-08-06). A preset is COMPLETE: --model/--effort
# refuse over --preset (tap crew add also refuses --env; tap ask refuses
# --model), while --env/--unset-env and the -- tail compose over a preset on
# tap launch and on tap session relaunch of a durable seat; crew relaunch
# refuses them. Precedence + error
# classes: skills/tap/protocol/delivery/cli-surface-the-whole-thing-part-04.md §Session launch presets.
# [harness.*] policy is read fresh on EVERY launch/resume, never persisted.

version = 3

# Claude/Codex/Cursor/AGY permission mode: "auto" (also the absent-key default) or "bypass".
# A bypass flag left in params refuses an auto launch; set permissions = "bypass" to keep it.
# Their launcher owns permission flags; OpenCode and Hermes keep theirs in params.
# Harness policy is read fresh on launch and resume.

[harness.agy]
permissions = "auto"

[harness.claude]
permissions = "auto"

[harness.codex]
permissions = "auto"
env.PONYTAIL_DEFAULT_MODE = "off"

[harness.cursor]
permissions = "auto"

[harness.hermes]

[harness.opencode]

# Show derived body previews when enabled; --preview overrides the body hint.
[sentinel]
preview = false
preview_chars = 120

[roles]
monitor = "Samples a declared subject on a regular cadence, writes a timestamped heartbeat with numbers each cycle, and reports crossings or errors to its charter recipient. Nightwatch, goalie and context genie are monitor variants. See skills/tap/protocol/supervision/monitor.md."
driver = "Drives an implementation lane. May also implement code, or delegate its lane to an implementer. See /tap:drive"
implementer = "Implements code from a prompt or a spec" # Todo: We should write our own skill that's like /subagent-driven-development + /executing-plans, but is TAP aware
reviewer = "Reviews code, plans, proposals, etc, either as itself, or as a particular reviewer agent definition provided to it"
partner = "A situational role for pair programming, pair research, or other tasks. Partners are agents that are strong implementers and reviewers, and can offer a turn by turn perspective on a task before escalating to a driver/conductor/leader. Generally, the partner should be a stronger model than the implementer or researcher in the pair."
debugger = "Debugs issues in code or on the machine"
leader = "Leads a TAP team, responsible for choreographing other agents, adding and removing teammates, managing teammate context. Delegates most or all of actual implementation work to other agents. May write plans, or review important parts of plans written by other agents. Pair with a conductor to save tokens! See /tap:lead"
conductor = "A conductor assists the leader with the variety of messages recieved from an active TAP team. Drivers, implementers, reviewers, etc send agents to the conductor, who will selectively relay questions to the leader as needed."
planner = "Comes up with ideas, and pressure tests ideas with other agents."
researcher = "Researches a given problem space, using both internet research and /ref-search"
prose_writer = "Writes or edits prose, such as comments, design documents, ADRs, and so forth."
architect = "Designs and refines the architecture of a system, including the codebase, the data model, the API, the UI, and the overall system design."
approver = "Approves a design or code change after other agents have reviewed it. The leader will assign an approver to various gates in the development process. (Or the leader may designate themselves as the approver). Approvers are generally a distinct seat from reviewers, to avoid rubber stamping something they've already seen."
goalie = "A monitor variant that checks team progress and reports stalled work or unmet objectives to the leader. Its charter defines cadence, heartbeat, escalation and any recovery authority."
tasker = "Runs tasks, such as running scripts, executing simple operations, gathering data from the machine, and other tasks that don't require a lot of intelligence."
prototyper = "Prototypes code, designs, and other artifacts quickly, to get a sense of what is possible. Generally top tier frontier models on lower effort settings are useful for this - to see if an ideas is feasible before handing robust implementation to cheaper seats."

# -- Intelligence Levels --

[intelligences]
s-tier = "Absolute top of the line frontier models to be used for situations requiring exceptional intelligence and capabilities."
frontier = "Frontier model with top of the line intelligence and capabilities, that is strong for executing agentic tasks, doing code reviews, and producing quality software"
advanced = "An advanced model which is useful for general execution tasks, implementation, and research."
medium = "A model useful for basic implementation, data analysis, quick scripting, and other tasks where the goal is very well defined and a more advanced model will check its work."
dumb = "A model which is generally fast and cheap, and useful for offloading more mechanical tasks from more expensive agents, such as detecting team deadlocks, running mechanical gates, data collecting and parsing, etc."

# Starter entries are the simple-mode wizard choices; fast and Ponytail variants are opt-in.
# OpenCode has no starter: its models depend on the providers a person has configured, so setup asks.
# Claude: params.effort. Codex: one model_reasoning_effort assignment in params.config.
# Cursor/AGY encode effort in params.model; other harnesses keep their model default.

